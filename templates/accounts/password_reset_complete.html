{% extends "base.html" %}

{% block title %}Password Reset Complete — {{ company.company_name }}{% endblock %}

{% block content %}
<div class="container" style="max-width: 480px; padding-top: 3.5rem; padding-bottom: 5rem;">
  <div class="card" style="box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.08), 0 5px 15px -3px rgba(0, 0, 0, 0.04); border: 1px solid var(--border); overflow: hidden; text-align: center;">
    
    <!-- Top Brand Accent Strip -->
    <div style="height: 4px; background: linear-gradient(90deg, var(--success), var(--primary));"></div>

    <div class="card-body" style="padding: 2.5rem 2rem;">
      <div style="background: var(--success-soft); color: var(--success); width: 64px; height: 64px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 1.25rem; box-shadow: 0 4px 14px var(--success-soft);">
        <i data-lucide="check" style="width: 32px; height: 32px;"></i>
      </div>

      <h1 style="font-size: 1.6rem; font-weight: 900; color: var(--text); letter-spacing: -0.02em; margin-bottom: 0.5rem;">
        Password Changed!
      </h1>

      <p style="color: var(--text-muted); font-size: 0.925rem; line-height: 1.5; margin-bottom: 2rem;">
        Your password has been set successfully. You may now sign in using your new credentials.
      </p>

      <a href="{% url 'accounts:login' %}" class="btn btn-primary" style="width: 100%; height: 44px; font-weight: 800; font-size: 0.95rem; display: flex; align-items: center; justify-content: center; gap: 0.4rem;">
        <i data-lucide="log-in" style="width: 16px; height: 16px;"></i> Sign In Now &rarr;
      </a>
    </div>

  </div>
</div>
{% endblock %}
